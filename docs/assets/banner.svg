<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="NexBrowser — a lighter, private Firefox-based browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081210"/>
      <stop offset="1" stop-color="#0a1614"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ddc84" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd3c4" stop-opacity=".30"/>
      <stop offset="1" stop-color="#2fd3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#d4ffe9"/>
      <stop offset="1" stop-color="#3ddc84"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
    <style>
      .orb { animation: drift 15s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 19s ease-in-out infinite alternate; }
      .chip { font: 500 15px 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; fill: #eafff4; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(130px, 26px); } }
      @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-150px, -18px); } }
      @media (prefers-reduced-motion: reduce) { .orb, .orb2 { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="orb" cx="280" cy="90" r="270" fill="url(#glow)"/>
    <circle class="orb2" cx="980" cy="240" r="250" fill="url(#glow2)"/>
    <rect width="1200" height="300" fill="url(#sheen)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".14"/>

  <text x="72" y="148" font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="80" font-weight="800" letter-spacing="-2.5" fill="url(#ink)">NexBrowser</text>

  <text x="76" y="192" font-family="Inter, -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="23" fill="#c7d6cf">A lighter, private Firefox fork with a Liquid Glass interface</text>

  <g transform="translate(76 222)">
    <rect width="160" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
    <text class="chip" x="80" y="22" text-anchor="middle">low memory</text>
    <rect x="172" width="186" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
    <text class="chip" x="265" y="22" text-anchor="middle">encrypted profiles</text>
    <rect x="370" width="140" height="34" rx="17" fill="#3ddc84" fill-opacity=".18" stroke="#3ddc84" stroke-opacity=".55"/>
    <text class="chip" x="440" y="22" text-anchor="middle">liquid glass</text>
  </g>

  <g transform="translate(1000 88)" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="1.5">
    <rect width="128" height="92" rx="14"/>
    <path d="M0 24H128"/>
    <circle cx="16" cy="12" r="3" fill="#3ddc84" stroke="none"/>
    <circle cx="30" cy="12" r="3" fill="#2fd3c4" stroke="none"/>
    <circle cx="44" cy="12" r="3" fill="#ffffff" fill-opacity=".5" stroke="none"/>
    <rect x="14" y="38" width="100" height="10" rx="5" fill="#fff" fill-opacity=".12" stroke="none"/>
    <rect x="14" y="56" width="68" height="10" rx="5" fill="#fff" fill-opacity=".12" stroke="none"/>
    <circle cx="100" cy="61" r="12" fill="none" stroke="#3ddc84" stroke-opacity=".9"/>
    <path d="M96 61l3 3 6-7" stroke="#3ddc84" stroke-opacity=".9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
