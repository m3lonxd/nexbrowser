# NexBrowser memory profile: trade a little speed and site isolation for a
# much smaller footprint than Firefox/Zen and Chromium-based browsers.

# Unload background tabs after they have been inactive for a while
# (see src/zen/common/sys/NexMemorySaver.sys.mjs).
- name: nexbrowser.memory-saver.enabled
  value: true

- name: nexbrowser.memory-saver.timeout-minutes
  value: 20

# Firefox enables low-memory tab unloading only on Windows and macOS.
- name: browser.tabs.unloadOnLowMemory
  value: true

# Treat memory as low earlier (default 5% available) so tabs are unloaded
# before the system starts swapping.
- name: browser.low_commit_space_threshold_percent
  value: 10

- name: browser.tabs.min_inactive_duration_before_unload
  value: 300000

# Fission: give a dedicated process only to high-value sites (logged in or
# COOP), like Firefox on Android, instead of one process per site.
- name: fission.webContentIsolationStrategy
  value: 2

- name: dom.ipc.processCount
  value: 4

- name: dom.ipc.processCount.webIsolated
  value: 1

# No idle content process kept around for the next tab.
- name: dom.ipc.processPrelaunch.enabled
  value: false

# Back/forward cache keeps whole pages in memory; the default scales up to 8
# pages with system RAM.
- name: browser.sessionhistory.max_total_viewers
  value: 2

# Decoded image cache, default 2 GB.
- name: image.mem.surfacecache.max_size_kb
  value: 524288

- name: network.prefetch-next
  value: false
