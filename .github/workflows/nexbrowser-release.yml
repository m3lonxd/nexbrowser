# NexBrowser sürümü: Linux, Windows ve macOS (Intel + Apple Silicon) paketlerini
# GitHub'ın ücretsiz Ubuntu makinelerinde derler (Windows ve macOS çapraz
# derlenir) ve hepsini tek bir GitHub sürümüne koyar. Paketler imzasızdır;
# PGO ve LTO, ücretsiz makinenin süre ve bellek sınırına sığmak için kapalıdır.

name: NexBrowser Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (ör. 0.1.0)"
        required: true
        type: string
      publish:
        description: "Paketleri GitHub sürümü olarak yayınla"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nexbrowser-release
  cancel-in-progress: false

jobs:
  linux:
    uses: ./.github/workflows/linux-release-build.yml
    secrets: inherit
    with:
      build-version: ${{ inputs.version }}
      release-branch: release
      MOZ_BUILD_DATE: ""
      use-sccache: false
      disable-pgo: true

  windows:
    uses: ./.github/workflows/windows-release-build.yml
    secrets: inherit
    with:
      build-version: ${{ inputs.version }}
      release-branch: release
      MOZ_BUILD_DATE: ""
      use-sccache: false
      generate-pgo: false
      disable-pgo: true

  macos:
    uses: ./.github/workflows/macos-release-build.yml
    secrets: inherit
    with:
      build-version: ${{ inputs.version }}
      release-branch: release
      MOZ_BUILD_DATE: ""
      use-sccache: false
      disable-pgo: true

  release:
    name: Publish release
    needs: [linux, windows, macos]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          set -ex
          mkdir release
          cp artifacts/zen.linux-x86_64.tar.xz/zen.linux-x86_64.tar.xz release/NexBrowser-${{ inputs.version }}-linux-x86_64.tar.xz
          cp artifacts/zen.installer.exe/zen.installer.exe release/NexBrowser-${{ inputs.version }}-windows-x64-setup.exe
          cp artifacts/zen-aarch64-apple-darwin-dist.dmg/zen-aarch64-apple-darwin-dist.dmg release/NexBrowser-${{ inputs.version }}-macos-apple-silicon.dmg
          cp artifacts/zen-x86_64-apple-darwin-dist.dmg/zen-x86_64-apple-darwin-dist.dmg release/NexBrowser-${{ inputs.version }}-macos-intel.dmg
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          Linux, Windows ve macOS için NexBrowser paketleri.

          Paketler imzasızdır. Windows SmartScreen'de **Ek bilgi → Yine de çalıştır**,
          macOS'ta ilk açılıştan önce Terminal'de
          `xattr -cr /Applications/NexBrowser.app` komutu gerekir.
          Dosyaları `SHA256SUMS.txt` ile doğrulayabilirsiniz.
          EOF
          gh release create "v${{ inputs.version }}" release/* \
            --target "${{ github.sha }}" \
            --title "NexBrowser ${{ inputs.version }}" \
            --notes-file notes.md
